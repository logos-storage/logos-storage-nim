name: Conventional Commits Linting

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  merge_group:

jobs:
  pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: PR Conventional Commit Validation
        uses:  ytanikin/pr-conventional-commits@1.4.1
        with:
          task_types: '["feat","fix","docs","test","ci","build","refactor","style","perf","chore","revert"]'
          # A fork PR token is read-only, so labelling fails the check.
          add_label: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
