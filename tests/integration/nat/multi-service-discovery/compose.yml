# NAT multi-service-discovery scenario — see README.md. Run via testmultiservicediscovery.nim.
name: multi-service-discovery

x-addresses:
  wan_subnet: &wan_subnet 7.7.7.0/24
  leecher_lan_subnet: &leecher_lan_subnet 10.99.5.0/24
  seeder_lan_subnet: &seeder_lan_subnet 10.99.6.0/24

  bootstrap_ip: &bootstrap_ip 7.7.7.10

  # Public nodes, all services each.
  public_node_1_ip: &public_node_1_ip 7.7.7.11
  public_node_2_ip: &public_node_2_ip 7.7.7.12
  public_node_3_ip: &public_node_3_ip 7.7.7.13
  public_node_4_ip: &public_node_4_ip 7.7.7.14

  # Both leecher and seeder are behind NATs.
  leecher_router_wan_ip: &leecher_router_wan_ip 7.7.7.20
  leecher_router_lan_ip: &leecher_router_lan_ip 10.99.5.20
  leecher_lan_ip: &leecher_lan_ip 10.99.5.21

  seeder_router_wan_ip: &seeder_router_wan_ip 7.7.7.30
  seeder_router_lan_ip: &seeder_router_lan_ip 10.99.6.30
  seeder_lan_ip: &seeder_lan_ip 10.99.6.31

networks:
  wan:
    internal: true
    ipam:
      config:
        - subnet: *wan_subnet

  leecher_lan:
    driver: bridge
    ipam:
      config:
        - subnet: *leecher_lan_subnet

  seeder_lan:
    driver: bridge
    ipam:
      config:
        - subnet: *seeder_lan_subnet

services:
  # Routers
  seeder_router:
    image: localhost/storage-nat
    logging:
      driver: k8s-file
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      wan:
        ipv4_address: *seeder_router_wan_ip
      seeder_lan:
        ipv4_address: *seeder_router_lan_ip
    environment:
      ROUTER_WAN_IP: *seeder_router_wan_ip
      LAN_SUBNET: *seeder_lan_subnet
    volumes:
      - ../router-common.sh:/scripts/router-common.sh:ro,z
    entrypoint: ["bash", "/scripts/router-common.sh"]

  leecher_router:
    image: localhost/storage-nat
    logging:
      driver: k8s-file
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      wan:
        ipv4_address: *leecher_router_wan_ip
      leecher_lan:
        ipv4_address: *leecher_router_lan_ip
    environment:
      ROUTER_WAN_IP: *leecher_router_wan_ip
      LAN_SUBNET: *leecher_lan_subnet
    volumes:
      - ../router-common.sh:/scripts/router-common.sh:ro,z
    entrypoint: ["bash", "/scripts/router-common.sh"]

  bootstrap:
    image: localhost/storage-nat
    logging:
      driver: k8s-file
    networks:
      wan:
        ipv4_address: *bootstrap_ip
    volumes:
      - ../node-entrypoint.sh:/scripts/node-entrypoint.sh:ro,z
    entrypoint: ["bash", "/scripts/node-entrypoint.sh"]
    command:
      - public_node
      - *bootstrap_ip

  public_node_1:
    image: localhost/storage-nat
    logging:
      driver: k8s-file
    networks:
      wan:
        ipv4_address: *public_node_1_ip
    volumes:
      - ../node-entrypoint.sh:/scripts/node-entrypoint.sh:ro,z
    entrypoint: ["bash", "/scripts/node-entrypoint.sh"]
    command:
      - public_node
      - *public_node_1_ip
      - *bootstrap_ip
      - -%-
      - enable_nat_servers
      - -%-
      - enable_mix
      - -%-
      - enable_dht_proxy

  public_node_2:
    image: localhost/storage-nat
    logging:
      driver: k8s-file
    networks:
      wan:
        ipv4_address: *public_node_2_ip
    volumes:
      - ../node-entrypoint.sh:/scripts/node-entrypoint.sh:ro,z
    entrypoint: ["bash", "/scripts/node-entrypoint.sh"]
    command:
      - public_node
      - *public_node_2_ip
      - *bootstrap_ip
      - -%-
      - enable_nat_servers
      - -%-
      - enable_mix
      - -%-
      - enable_dht_proxy

  public_node_3:
    image: localhost/storage-nat
    logging:
      driver: k8s-file
    networks:
      wan:
        ipv4_address: *public_node_3_ip
    volumes:
      - ../node-entrypoint.sh:/scripts/node-entrypoint.sh:ro,z
    entrypoint: ["bash", "/scripts/node-entrypoint.sh"]
    command:
      - public_node
      - *public_node_3_ip
      - *bootstrap_ip
      - -%-
      - enable_nat_servers
      - -%-
      - enable_mix
      - -%-
      - enable_dht_proxy

  public_node_4:
    image: localhost/storage-nat
    logging:
      driver: k8s-file
    networks:
      wan:
        ipv4_address: *public_node_4_ip
    volumes:
      - ../node-entrypoint.sh:/scripts/node-entrypoint.sh:ro,z
    entrypoint: ["bash", "/scripts/node-entrypoint.sh"]
    command:
      - public_node
      - *public_node_4_ip
      - *bootstrap_ip
      - -%-
      - enable_nat_servers
      - -%-
      - enable_mix
      - -%-
      - enable_dht_proxy

  seeder:
    image: localhost/storage-nat
    logging:
      driver: k8s-file
    cap_add: [NET_ADMIN]
    networks:
      seeder_lan:
        ipv4_address: *seeder_lan_ip
    ports:
      - "127.0.0.1:18097:8080"
    volumes:
      - ../node-entrypoint.sh:/scripts/node-entrypoint.sh:ro,z
    entrypoint: ["bash", "/scripts/node-entrypoint.sh"]
    command:
      - private_node
      - *seeder_router_lan_ip
      - *bootstrap_ip
      - -%-
      - enable_mix

  leecher:
    image: localhost/storage-nat
    logging:
      driver: k8s-file
    cap_add: [NET_ADMIN]
    networks:
      leecher_lan:
        ipv4_address: *leecher_lan_ip
    ports:
      - "127.0.0.1:18098:8080"
    volumes:
      - ../node-entrypoint.sh:/scripts/node-entrypoint.sh:ro,z
    entrypoint: ["bash", "/scripts/node-entrypoint.sh"]
    command:
      - private_node
      - *leecher_router_lan_ip
      - *bootstrap_ip
      - -%-
      - enable_mix
